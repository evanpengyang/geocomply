[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idcomply-workbench"
version = "0.1.0"
description = "Evidence-backed decision workbench for the IDComply waterfall case"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
